# Herdr configuration — matugen template.
# Hand-edit THIS file. matugen renders it to ~/.config/herdr/config.toml
# (herdr has no include mechanism, so the whole config is generated).
# Never edit the rendered config.toml directly; it is overwritten on every matugen run.

[theme]
# Base theme; every custom token below overrides it.
name = "catppuccin"

# Material You colors generated by matugen (dark scheme, same as the kitty template).
# Full token list from herdr 0.8.0: accent, panel_bg, surface0, surface1,
# surface_dim, overlay0, overlay1, text, subtext0, mauve, green, yellow,
# red, blue, teal, peach.
[theme.custom]
panel_bg    = "{{ colors.surface_container.dark.hex }}"
surface_dim = "{{ colors.surface_dim.dark.hex }}"
surface0    = "{{ colors.surface_container_high.dark.hex }}"
surface1    = "{{ colors.surface_container_highest.dark.hex }}"
overlay0    = "{{ colors.outline_variant.dark.hex }}"
overlay1    = "{{ colors.outline.dark.hex }}"
text        = "{{ colors.on_surface.dark.hex }}"
subtext0    = "{{ colors.on_surface_variant.dark.hex }}"
accent      = "{{ colors.primary.dark.hex }}"
# ANSI-ish tokens mapped like kitty's color1..color5
red         = "{{ colors.error.light.hex }}"
green       = "{{ colors.source_color.dark.hex }}"
yellow      = "{{ colors.secondary.dark.hex }}"
blue        = "{{ colors.primary.dark.hex }}"
mauve       = "{{ colors.tertiary_fixed_dim.dark.hex }}"
teal        = "{{ colors.tertiary.dark.hex }}"
peach       = "{{ colors.secondary_fixed_dim.dark.hex }}"

[ui]
agent_panel_sort = "spaces"

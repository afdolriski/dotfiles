# Herdr configuration — matugen template. Hand-edit THIS file; matugen renders it
# to ~/.config/herdr/config.toml, which is overwritten on every run. herdr has no
# include mechanism, so the whole config has to be generated.

[theme]
# Base theme; every custom token below overrides it.
name = "catppuccin"

# Material You colors, dark scheme. Surfaces/text/accent come from Material
# roles; the named hues come from the shared anchors + `harmonize` (see
# config.toml). The tokens below are herdr 0.8.0's complete set.
[theme.custom]
panel_bg    = "{{ colors.surface_container.dark.hex }}"
surface_dim = "{{ colors.surface_dim.dark.hex }}"
surface0    = "{{ colors.surface_container_high.dark.hex }}"
surface1    = "{{ colors.surface_container_highest.dark.hex }}"
overlay0    = "{{ colors.outline_variant.dark.hex }}"
overlay1    = "{{ colors.outline.dark.hex }}"
text        = "{{ colors.on_surface.dark.hex }}"
subtext0    = "{{ colors.on_surface_variant.dark.hex }}"
accent      = "{{ colors.primary.dark.hex }}"
# Named hues, matching kitty's color1..color6 exactly
red         = "{{ "#e35b60" | to_color | harmonize: {{ colors.source_color.default.hex }} }}"
green       = "{{ "#6bbf72" | to_color | harmonize: {{ colors.source_color.default.hex }} }}"
yellow      = "{{ "#d9a441" | to_color | harmonize: {{ colors.source_color.default.hex }} }}"
blue        = "{{ "#6fa8ff" | to_color | harmonize: {{ colors.source_color.default.hex }} }}"
mauve       = "{{ "#c88ce0" | to_color | harmonize: {{ colors.source_color.default.hex }} }}"
teal        = "{{ "#5cbcc4" | to_color | harmonize: {{ colors.source_color.default.hex }} }}"
peach       = "{{ "#e0854b" | to_color | harmonize: {{ colors.source_color.default.hex }} }}"

[ui]
agent_panel_sort = "spaces"
hide_tab_bar_when_single_tab = true

[keys]
prefix = "ctrl+h"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

[experimental]
kitty_graphics = true
